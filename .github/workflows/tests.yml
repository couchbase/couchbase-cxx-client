name: tests
permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev cmake gcc g++ curl libcurl4-openssl-dev libprotobuf-dev libgrpc-dev libgrpc++-dev gdb protobuf-compiler protobuf-compiler-grpc
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate test labels
        run: ./bin/validate-test-labels
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
      - name: Build tests
        timeout-minutes: 40
        run: ./bin/build-tests
        env:
          CB_NUMBER_OF_JOBS: 8
          # Generate and compile the Protostellar gRPC/protobuf stubs, and the CNG tests that use
          # them. The gRPC/protobuf dev packages this needs are installed above. Without it the
          # generated stubs are never built by CI, so codegen breakage would only ever surface
          # locally; later commits add the couchbase2:// transport on top of the same option.
          CB_COUCHBASE2: 1
      - name: Upload build artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./cmake-build-tests
  unit:
    needs: build
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          # libgrpc++-dev/libprotobuf-dev pull in the gRPC runtime needed to *run* the gRPC-linked
          # binaries in the prebuilt artifact -- currently cng_codegen_smoke_test. (A later commit
          # links the transport into the client library itself, which extends this to every binary.)
          sudo apt-get install -y libssl-dev cmake gcc g++ curl gdb libprotobuf-dev libgrpc-dev libgrpc++-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./cmake-build-tests
      - name: Run unit tests
        timeout-minutes: 40
        env:
          TEST_LOG_LEVEL: trace
        run: |
          chmod -R +x ./cmake-build-tests
          ./bin/run-unit-tests
      - name: Run CNG tests
        # The CNG tests carry LABELS "cng" (test/cng/CMakeLists.txt), which matches none of the
        # --label-regex filters in bin/run-{unit,integration,transaction,benchmark}-tests. Without
        # this step they are compiled and linked by the build job but never executed by any job.
        #
        # --no-tests=error is load-bearing: a --label-regex that matches nothing makes ctest exit 0
        # (measured: exit 0 without the flag, 8 with it), so a renamed label or a BUILD_CNG_TESTS
        # that silently went OFF would leave this step passing vacuously -- the same "green means
        # nothing ran" failure this step exists to close. Needs ctest >= 3.20; CI has 3.28.3.
        #
        # --output-junit resolves relative to --test-dir, so the report lands beside the build tree.
        # The name deliberately differs from the results.xml that bin/run-unit-tests has already
        # written into the same directory, and it is uploaded as its own artifact rather than folded
        # into unit-test-results: a CNG test is not a unit test.
        #
        # always(): a unit-test failure must not mask CNG results.
        if: ${{ always() }}
        timeout-minutes: 10
        env:
          TEST_LOG_LEVEL: trace
        run: |
          chmod -R +x ./cmake-build-tests
          ctest --test-dir ./cmake-build-tests --output-on-failure --label-regex 'cng' \
                --no-tests=error --output-junit cng-results.xml
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          # bin/run-unit-tests cds into the build dir before ctest, so --output-junit lands there.
          path: ./cmake-build-tests/results.xml
          if-no-files-found: warn
      - name: Upload CNG test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cng-test-results
          path: ./cmake-build-tests/cng-results.xml
          if-no-files-found: warn
  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        server:
          - 8.0.1-4792
          - 8.0.0
          - 7.6.10
          - 7.2.9
          - 7.1.6
          - 7.0.5
        suite:
          - integration
          - transaction
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          # libgrpc++-dev/libprotobuf-dev pull in the gRPC runtime needed to *run* the gRPC-linked
          # binaries in the prebuilt artifact -- currently cng_codegen_smoke_test. (A later commit
          # links the transport into the client library itself, which extends this to every binary.)
          sudo apt-get install -y libssl-dev cmake gcc g++ curl gdb libprotobuf-dev libgrpc-dev libgrpc++-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./cmake-build-tests
      - name: Create Couchbase cluster with cbdinocluster
        id: cbdino
        uses: ./.github/actions/create-cluster
        with:
          version: ${{ matrix.server }}
          suite: ${{ matrix.suite }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check couchbase
        env:
          HOST: ${{ steps.cbdino.outputs.ip }}
        run: ./bin/check-cluster
      - name: Run ${{ matrix.suite }} tests
        timeout-minutes: 40
        env:
          TEST_SERVER_VERSION: ${{ matrix.server }}
          TEST_CONNECTION_STRING: ${{ steps.cbdino.outputs.connstr }}
          TEST_LOG_LEVEL: trace
        run: |
          chmod -R +x ./cmake-build-tests
          ./bin/run-${{ matrix.suite }}-tests
      - name: Remove Couchbase cluster
        uses: ./.github/actions/remove-cluster
        with:
          id: ${{ steps.cbdino.outputs.id }}
  cng:
    # CNG (couchbase2://) tests against a real Cloud Native Gateway. The gateway is only deployable
    # by the Couchbase Autonomous Operator, so unlike the `integration` job this one needs a
    # Kubernetes cluster (k3d) rather than the docker deployer.
    needs: build
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev cmake gcc g++ curl gdb libprotobuf-dev libgrpc-dev libgrpc++-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./cmake-build-tests
      - name: Create Couchbase cluster with Cloud Native Gateway
        id: cbdino
        uses: ./.github/actions/create-cng-cluster
        with:
          version: 8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run CNG tests
        timeout-minutes: 40
        env:
          # The cng suite reads this to pick real-cluster mode; cases gated cluster_only skip
          # without it. Credentials default to cbdinocluster's Administrator/password.
          TEST_CONNECTION_STRING: ${{ steps.cbdino.outputs.connstr }}
          TEST_LOG_LEVEL: trace
        run: |
          chmod -R +x ./cmake-build-tests
          # --verbose rather than --output-on-failure, which prints nothing for a passing suite.
          # Several cluster-only cases skip themselves on a condition of the cluster -- no spare
          # KV quota, too few data servers for a minimum durability level, a service the gateway
          # does not implement -- and each of those decisions is invisible in a green log without
          # this. A suite that quietly stops exercising a case still reports 100% passed, which is
          # the failure mode these tests exist to prevent, so the log has to say what ran.
          ctest --test-dir ./cmake-build-tests --verbose --label-regex 'cng' \
                --no-tests=error --output-junit cng-live-results.xml
      - name: Upload CNG live test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          # Distinct from the unit job's cng-test-results: artifact names must be unique per run.
          name: cng-live-test-results
          path: ./cmake-build-tests/cng-live-results.xml
          if-no-files-found: warn
      - name: Remove Couchbase cluster
        if: ${{ always() }}
        uses: ./.github/actions/remove-cluster
        with:
          id: ${{ steps.cbdino.outputs.id }}
