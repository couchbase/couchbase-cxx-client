name: abi
permissions: {}

# Checks that the ABI of libcouchbase_cxx_client.so.MAJOR.MINOR does not break while the soname
# stays the same. bin/check-abi describes what each event is compared with.
on:
  push:
    branches:
      - main
      - release-*
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:
    inputs:
      ref:
        type: string
        description: "Tag, branch or commit to record as the ABI baseline of its soname"
        required: true

# Pull request runs cancel each other. Every other run has a group of its own, so none replaces
# another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    if: github.event_name != 'workflow_dispatch'
    # bin/check-abi requires the libabigail release this image ships.
    runs-on: ubuntu-26.04
    # This job builds and runs the code under test, so it only reads. The publish job records the
    # result it writes.
    permissions:
      contents: read
      deployments: read
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: sudo apt-get update && sudo apt-get install -y abigail-tools ccache
      # The build of a pull request runs its own code, so the token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the report parser against its fixtures
        run: bin/check-abi --self-test
      - name: Tool versions
        id: tools
        run: echo "key=$(bin/check-abi tools-key)" >> "${GITHUB_OUTPUT}"
      # A dump depends on the tool versions and on the build and abidw options in bin/check-abi.
      - name: Restore ABI dumps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: abi-dumps
          key: abi-dumps-${{ steps.tools.outputs.key }}-${{ hashFiles('bin/check-abi') }}-${{ github.run_id }}
          restore-keys: abi-dumps-${{ steps.tools.outputs.key }}-${{ hashFiles('bin/check-abi') }}-
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-abi-${{ github.run_id }}
          restore-keys: ccache-abi-
      - name: Compare
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/check-abi ci
      # Only branch pushes save. A pull request's cache would serve that pull request alone, and a
      # tag's cache that tag alone. bin/check-abi keeps the dumps of the most recently used commits,
      # so a pull request usually finds its base once the push of that base has run.
      - name: Save ccache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'branch' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-abi-${{ github.run_id }}
      - name: Save ABI dumps
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'branch' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: abi-dumps
          key: abi-dumps-${{ steps.tools.outputs.key }}-${{ hashFiles('bin/check-abi') }}-${{ github.run_id }}
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abi-report
          path: |
            report-*.txt
            abi-result.json
          if-no-files-found: ignore

  record:
    needs: compare
    if: ${{ !cancelled() && ((github.ref_type == 'tag' && needs.compare.result == 'success') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      deployments: write
    steps:
      # The workflow's own commit supplies bin/check-abi, since the recorded ref may predate it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || github.ref }}
          NAME: ${{ inputs.ref || github.ref_name }}
        run: |
          git fetch --depth 1 --no-tags --end-of-options origin "${REF}"
          bin/check-abi record FETCH_HEAD "${NAME}"

  # Records the result of a branch push and keeps the reports of every run in refs/site/pages, with
  # the page bin/check-abi renders from the deployments. It builds nothing, so no code under test runs
  # with its write permissions.
  publish:
    needs: [compare, record]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A manual run compares nothing and only renders the page again. bin/check-abi publish decides
      # what a branch push without a result means, from the result of the compare job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: abi-report
          path: abi-report
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_RESULT: ${{ needs.compare.result }}
        run: bin/check-abi publish "${GITHUB_SHA}" abi-report

  # Deploys the head of refs/site/pages, which holds the whole site. The github-pages environment
  # deploys from main only, so the results of release branches and tags reach the site with the next
  # deployment from main.
  deploy:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    concurrency:
      group: ${{ github.workflow }}-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Fetch the site
        run: |
          git init --quiet site
          git -C site fetch --quiet --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" refs/site/pages
          git -C site checkout --quiet FETCH_HEAD
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
