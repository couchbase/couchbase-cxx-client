name: build
permissions: {}

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.os }}
      - name: Build tests (${{ matrix.os }})
        timeout-minutes: 60
        env:
          CB_NUMBER_OF_JOBS: 8
          # Compile the generated Protostellar stubs on Apple clang too. These legs already build
          # gRPC and protobuf from source for fit_performer -- BUILD_FIT_PERFORMER defaults to
          # BUILD_TOOLS, so ThirdPartyDependencies.cmake pulls in GrpcProtobuf.cmake regardless --
          # so the only added cost is generating and compiling the schema. Apple clang is otherwise
          # never exercised against the generated code.
          CB_COUCHBASE2: 1
        run: ./bin/build-tests
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      # BoringSSL's x86/x64 assembly is assembled with nasm; the ARM64 leg
      # builds with OPENSSL_NO_ASM and therefore does not need it.
      - name: Install dependencies
        timeout-minutes: 20
        if: matrix.os != 'windows-11-arm'
        run: |
          choco install --no-progress nasm
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.os }}
          variant: sccache
      - name: Build tests (${{ matrix.os }})
        timeout-minutes: 120
        env:
          CB_CACHE_OPTION: sccache
          # Release rather than RelWithDebInfo: these legs link out of disk.
          # RelWithDebInfo compiles /Zi and links /debug, giving every test
          # binary a compiler PDB, a linker PDB and an .ilk beside it. The
          # x86-64 runners absorb that on their D: work volume; windows-11-arm
          # has only C:, where it takes the volume to 0 MB free and the link
          # fails with LNK1318. Release emits none of the three. NDEBUG is set
          # under both, so only the optimisation level changes; what is given
          # up is symbols in the cdb backtrace bin/build-tests.rb prints when
          # cbc crashes.
          CB_CMAKE_BUILD_TYPE: Release
          # No BoringSSL assembly exists for the Windows ARM64 target, so build
          # the crypto sources in portable C-only mode on that leg.
          CB_OPENSSL_NO_ASM: ${{ matrix.os == 'windows-11-arm' && '1' || '' }}
          # CB_NUMBER_OF_JOBS deliberately unset: build-tests.rb now autodetects
          # the runner's processor count via Etc.nprocessors (4 on windows-2022/2025).
          # Combined with /MP added in CMakeLists.txt this enables both axes of
          # parallelism instead of the previous /m:2 + serial-cl.exe cap.
          #
          # Compile the generated Protostellar stubs on MSVC. This leg already builds gRPC and
          # protobuf from source for fit_performer, so the only added cost is generating and
          # compiling the 14 services -- and MSVC is the only toolchain where the generated
          # protobuf/gRPC code needs special handling (see the MSVC branch of
          # cmake/Protostellar.cmake), which nothing else in CI would exercise.
          CB_COUCHBASE2: 1
        run: ruby ./bin/build-tests.rb
