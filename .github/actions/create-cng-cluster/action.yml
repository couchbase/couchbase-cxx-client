name: create-cng-cluster
description: >
  Creates a Couchbase cluster fronted by Cloud Native Gateway (the couchbase2:// gRPC endpoint)
  using cbdinocluster's Couchbase Autonomous Operator deployer on a local k3d Kubernetes cluster.
  Separate from create-cluster because CNG is only deployable by the operator: the docker deployer
  has no gateway, so there is no couchbase2:// endpoint to connect to.
inputs:
  version:
    description: 'Couchbase Server version to use'
    required: true
  operator-version:
    # Release versions only. cbdinocluster maps a version with a build number (e.g. 2.8.0-123) to
    # ghcr.io/cb-vanilla/*, which needs a Couchbase-org token; a plain release maps to the public
    # couchbase/* image on Docker Hub and needs no credentials at all. Keep it that way.
    # 2.8.0 also matches the cao-tools version cbdinocluster's `init` downloads by default.
    description: 'Couchbase Autonomous Operator release version'
    required: false
    default: '2.8.0'
  gateway-version:
    description: 'Cloud Native Gateway release version'
    required: false
    default: '1.2.1'
  bucket:
    description: 'Bucket to create for the tests'
    required: false
    default: 'default'
outputs:
  connstr:
    description: 'couchbase2:// connection string for the gateway'
    value: ${{ steps.start-cluster.outputs.connstr }}
  id:
    description: 'The cbdinocluster ID of the created cluster'
    value: ${{ steps.start-cluster.outputs.id }}
runs:
  using: composite
  steps:
    - name: Install k3d and cbdinocluster
      shell: bash
      run: |
        mkdir -p "$HOME/bin"
        wget -nv -O $HOME/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
        # Newer than the v0.0.86 that create-cluster (docker deployer) pins: the cao deployer only
        # learned to create buckets in v0.0.104 ("Implemented gocbcorex based helper for caodeploy"),
        # and before that `buckets add` fails outright with "caodeploy does not support creating
        # buckets". v0.0.104 is the floor; this pins the newest release at time of writing.
        wget -nv -O $HOME/bin/cbdinocluster https://github.com/couchbaselabs/cbdinocluster/releases/download/v0.0.119/cbdinocluster-linux-amd64
        chmod +x $HOME/bin/k3d $HOME/bin/cbdinocluster
        echo "$HOME/bin" >> $GITHUB_PATH
    - name: Create Kubernetes cluster
      shell: bash
      run: |
        k3d cluster create cbdino --wait
        kubectl wait --for=condition=Ready nodes --all --timeout=180s
        kubectl get nodes -o wide
    - name: Initialize cbdinocluster
      shell: bash
      run: |
        # No context flag on purpose. cbdinocluster registers --k8s-context but its handler reads an
        # unregistered "kube-context", so the value is discarded either way and it always falls back
        # to the kubeconfig's current-context -- which is exactly what `k3d cluster create` sets.
        cbdinocluster -v init --auto --kube-config "$HOME/.kube/config"
        cbdinocluster ps
    - name: Report runner capacity
      shell: bash
      run: |
        # Three server pods plus k3s, the operator and the gateway share one runner, and when that
        # does not fit the failure surfaces as a pod that never becomes ready -- which reads like a
        # deployment problem rather than a resource one. Printed before allocation so the first
        # failing run already carries the numbers, instead of costing a second run to collect them.
        echo "== cpu";    nproc; cat /proc/loadavg
        echo "== memory"; free -h
        echo "== disk";   df -h / /var/lib/docker 2>/dev/null
        echo "== kubernetes node capacity"
        kubectl get nodes -o custom-columns='NAME:.metadata.name,CPU:.status.capacity.cpu,MEM:.status.capacity.memory,PODS:.status.capacity.pods'
    - name: Start Couchbase cluster with Cloud Native Gateway
      id: start-cluster
      shell: bash
      env:
        # Three KV nodes, which is what create-cluster allocates for the non-CNG suites on the same
        # runner. A single node cannot satisfy any minimum durability level, so the bucket case that
        # asks for one skips there instead of running -- and a topology that silently skips a case
        # is how a test comes to pass everywhere except where it matters.
        #
        # The `docker:` memory block that create-cluster uses is ignored by the cao deployer, and its
        # `cao:` section has no quota fields either, so the operator's 256 MiB service defaults apply
        # until the resource is patched below.
        #
        # fts is in the list because the live search case needs a search service to answer, not an
        # index. It queries an index that was never created and accepts the gateway's
        # index-not-found, which is an answer only a cluster running fts can give; without the
        # service the request fails as an internal error instead and the case goes red. No index is
        # built here, so the default search quota is enough -- one that has to serve queries needs
        # considerably more, which is what search index management will have to provision for.
        CLUSTER_CONFIG: |
          nodes:
            - count: 1
              version: ${{ inputs.version }}
              services: [kv, n1ql, index]
            - count: 1
              version: ${{ inputs.version }}
              services: [kv, fts]
            - count: 1
              version: ${{ inputs.version }}
              services: [kv]
          cao:
            operator-version: "${{ inputs.operator-version }}"
            gateway-version: "${{ inputs.gateway-version }}"
          expiry: 1h
      run: |
        CBDC_ID=$(cbdinocluster -v alloc --deployer cao --def="${CLUSTER_CONFIG}")
        echo "CBDC_ID=$CBDC_ID" >> "$GITHUB_ENV"
        echo "id=$CBDC_ID" >> "$GITHUB_OUTPUT"
        # The tests set tls_verify_mode::none themselves, so the bare connstr is what they want:
        # couchbase2 is always TLS and the gateway's dev certificate is not chainable.
        echo "connstr=$(cbdinocluster -v connstr --couchbase2 $CBDC_ID)" >> "$GITHUB_OUTPUT"
    - name: Raise the data service quota
      shell: bash
      run: |
        # The bucket and collection management cases create buckets of their own, and at the
        # operator's 256 MiB default the 100 MB test bucket leaves no room for one -- the create
        # would report the gateway's "ram quota specified is too large" and fail the case.
        #
        # 1280 MiB is set by the largest of those buckets: the collection history retention case
        # needs a magma bucket, and the gateway refuses to create one below 1024 MB whatever the
        # server would accept. With the 100 MB test bucket alongside it that is 1124 MB, and ctest
        # runs the CNG suites serially, so no two test buckets are ever allocated at once. Three KV
        # nodes reserve it each, which is 3.8 GiB of the runner's 15.
        #
        # It has to be a patch: the quota cannot be expressed in the cluster definition, and setting
        # it through /pools/default is reconciled away by the operator within the minute.
        kubectl -n "cbdc2-$CBDC_ID" patch couchbasecluster cluster --type=merge \
          -p '{"spec":{"cluster":{"dataServiceMemoryQuota":"1280Mi"}}}'
        # Waiting on condition=Available would prove nothing: it is already true from before the
        # patch, so the wait returns instantly and the bucket could be created against the old
        # quota. Poll the cluster itself for the applied value, and fail here rather than leave the
        # management cases to fail one by one on a bucket create.
        MGMT=$(cbdinocluster mgmt "$CBDC_ID" | tail -1)
        for _ in $(seq 1 30); do
          QUOTA=$(curl -sS -u Administrator:password "$MGMT/pools/default" | jq -r '.memoryQuota')
          echo "data service quota: $QUOTA"
          [ "$QUOTA" = "1280" ] && break
          sleep 5
        done
        [ "$QUOTA" = "1280" ] || { echo "::error::data service quota never reached 1280 MiB"; exit 1; }
    - name: Add bucket
      shell: bash
      env:
        # Map input to an environment variable to prevent shell injection
        BUCKET: ${{ inputs.bucket }}
      run: |
        # One replica, which three KV nodes can hold: a replica-less bucket is not what anything runs
        # in production, and it hides the durability and replica-read paths behind a topology no
        # caller has.
        cbdinocluster buckets add $CBDC_ID "$BUCKET" --ram-quota-mb 100 --num-replicas 1
    - name: Dump cluster state on failure
      if: ${{ failure() }}
      shell: bash
      run: |
        # Resources first: a pod that never became ready because the runner ran out of memory looks
        # identical to one that failed to deploy, and only these two say which it was.
        echo "== memory at failure"; free -h
        echo "== disk at failure";   df -h / /var/lib/docker 2>/dev/null | sort -u
        # Allocatable vs the sum of pod requests, plus any eviction or scheduling conditions.
        kubectl describe nodes || true
        # Pending pods and OOM kills show up here rather than in the pod description.
        kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
        kubectl get pods,svc -A || true
        # The CouchbaseCluster CRD only exists once the operator is installed, so tolerate its
        # absence rather than letting it mask the output above.
        kubectl get couchbaseclusters -A || true
        kubectl describe pods -A || true
        # `kubectl logs` has no -A/--all-namespaces, so walk the namespaces explicitly.
        for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          kubectl logs -n "$ns" -l app=couchbase-operator --tail=200 || true
        done
