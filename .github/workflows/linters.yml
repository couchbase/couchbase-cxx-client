name: linters
permissions: {}

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*

env:
  LLVM_VERSION: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  log_annotations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checker is a heuristic over argument names, so it can only report what looks
      # sensitive and is not wrapped. A pass is not proof that the logs are correctly redacted.
      # Its own fixture runs first: the analysis is fiddly enough that a silently empty report is
      # a realistic failure, and that would look exactly like a clean tree.
      - name: Verify the annotation checker against its fixture
        run: ./bin/check-log-annotations --self-test
      - name: Check log annotations
        run: ./bin/check-log-annotations

  clang_format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget gnupg2 git
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --output /etc/apt/keyrings/llvm-snapshot.gpg
          sudo bash -c "echo 'deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main' >> /etc/apt/sources.list"
          sudo apt-get update -y
          sudo apt-get install -y clang-format-${LLVM_VERSION}
      - name: Run clang-format
        run: ./bin/check-clang-format
        env:
          CB_GIT_CLANG_FORMAT: /usr/bin/git-clang-format-${{ env.LLVM_VERSION }}
          CB_CLANG_FORMAT: /usr/bin/clang-format-${{ env.LLVM_VERSION }}

  clang_static_analyzer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev cmake curl wget gnupg2 libcurl4-openssl-dev libprotobuf-dev libgrpc-dev libgrpc++-dev gdb protobuf-compiler protobuf-compiler-grpc
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --output /etc/apt/keyrings/llvm-snapshot.gpg
          sudo bash -c "echo 'deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main' >> /etc/apt/sources.list"
          sudo apt-get update -y
          sudo apt-get install -y clang-${LLVM_VERSION} clang-tools-${LLVM_VERSION}
      - name: Run scan build
        run: ./bin/check-clang-static-analyzer
        env:
          CB_CC: /usr/bin/clang-${{ env.LLVM_VERSION }}
          CB_CXX: /usr/bin/clang++-${{ env.LLVM_VERSION }}
          CB_SCAN_BUILD: /usr/bin/scan-build-${{ env.LLVM_VERSION }}
      - name: Upload scan-build report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: cmake-build-report.tar.gz

  cppcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev cmake curl wget gnupg2 cppcheck libcurl4-openssl-dev libprotobuf-dev libgrpc-dev libgrpc++-dev gdb protobuf-compiler protobuf-compiler-grpc
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --output /etc/apt/keyrings/llvm-snapshot.gpg
          sudo bash -c "echo 'deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main' >> /etc/apt/sources.list"
          sudo apt-get update -y
          sudo apt-get install -y clang-${LLVM_VERSION}
      - name: Run cppcheck
        run: ./bin/check-cppcheck
        env:
          CB_CC: /usr/bin/clang-${{ env.LLVM_VERSION }}
          CB_CXX: /usr/bin/clang++-${{ env.LLVM_VERSION }}

  clang_tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Need history back to the PR base so the diff-based run can find it.
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev cmake curl wget gnupg2 libcurl4-openssl-dev libprotobuf-dev libgrpc-dev libgrpc++-dev gdb protobuf-compiler protobuf-compiler-grpc
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --output /etc/apt/keyrings/llvm-snapshot.gpg
          sudo bash -c "echo 'deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main' >> /etc/apt/sources.list"
          sudo apt-get update -y
          sudo apt-get install -y clang-${LLVM_VERSION} clang-tidy-${LLVM_VERSION} clang-tools-${LLVM_VERSION}
      # On pull requests, analyze only the sources changed against the base branch.
      - name: Run clang-tidy (changed files)
        if: ${{ github.event_name == 'pull_request' }}
        run: ./bin/check-clang-tidy
        env:
          CB_CC: /usr/bin/clang-${{ env.LLVM_VERSION }}
          CB_CXX: /usr/bin/clang++-${{ env.LLVM_VERSION }}
          CB_CLANG_TIDY: /usr/bin/clang-tidy-${{ env.LLVM_VERSION }}
          CB_NUMBER_OF_JOBS: 4
          CB_TIDY_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
      # On push to a protected branch, analyze the whole library.
      - name: Run clang-tidy (full)
        if: ${{ github.event_name != 'pull_request' }}
        run: ./bin/check-clang-tidy
        env:
          CB_CC: /usr/bin/clang-${{ env.LLVM_VERSION }}
          CB_CXX: /usr/bin/clang++-${{ env.LLVM_VERSION }}
          CB_CLANG_TIDY: /usr/bin/clang-tidy-${{ env.LLVM_VERSION }}
          CB_RUN_CLANG_TIDY: /usr/bin/run-clang-tidy-${{ env.LLVM_VERSION }}
          CB_NUMBER_OF_JOBS: 4
      - name: Upload clang-tidy fixes
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-tidy-fixes
          path: cmake-build-clang-tidy/build/clang-tidy-fixes.yaml
          if-no-files-found: ignore

  # bin/check-export-map checks the exports of the packaged library against clang's view of the
  # public headers, independently of cmake/GenerateExportMap.cmake, and that each public header
  # compiles on its own.
  export_map:
    runs-on: ubuntu-24.04
    # The digest fixes the image; moving to a newer Fedora 44 build means updating it.
    container: registry.fedoraproject.org/fedora:44@sha256:4688bc8003a1a6a7815e5f9d1f1b5c6bc9cafa582654af7cec61435d91655e3b
    env:
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Install dependencies
        timeout-minutes: 20
        run: dnf install -y binutils ccache clang cmake fmt-devel gcc-c++ git ninja-build ruby
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the checker against its fixtures
        run: bin/check-export-map --self-test
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-export-map-${{ github.run_id }}
          restore-keys: ccache-export-map-
      - name: Check the exported symbols
        timeout-minutes: 90
        run: bin/check-export-map --build build
      # Only pushes save, so pull requests do not evict other workflows' caches.
      - name: Save ccache
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-export-map-${{ github.run_id }}

  action_pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout, and tags of public action repositories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check action pins
        env:
          GH_TOKEN: ${{ github.token }}
        # The runner image's Ruby; the script needs only the standard library and gh.
        run: ruby bin/check-action-pins.rb
